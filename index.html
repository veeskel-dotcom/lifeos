<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Персональный ассистент: финансы, здоровье, задачи, инвестиции" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LifeOS</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #000;
        color: #fff;
      }
      @media (prefers-color-scheme: light) {
        #splash { background: #F2F2F7; color: #000; }
      }
      #splash img { width: 80px; height: 80px; border-radius: 20px; }
      #splash .name { font-size: 20px; font-weight: 700; margin-top: 16px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <img src="/icon-192.png" alt="LifeOS" />
        <div class="name">LifeOS</div>
      </div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
